name: desktop-build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # 引擎是纯 TypeScript，91 个用例覆盖 15 个音源的解析与加密逻辑，不需要任何外部运行时
      - name: Engine tests
        run: npm run engine:test

      - name: Build (main / preload / renderer)
        run: npm run build

      - name: Package
        env:
          # 没有证书时跳过签名与公证，产出可直接运行的安装包
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes electron-builder --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurora-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            # electron-updater 元数据与增量校验文件，必须随 Release 分发
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: warn
          retention-days: 7

  # 推送 v* 标签时触发：汇总三平台安装包并发布到 GitHub Release
  release:
    name: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload installers to draft release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          # 先建草稿：资产传完再转正，避免「版本已可见但安装包还下不到」的瞬时 404
          draft: true

      # 转正草稿：必须先「列 release 找 id」再 PATCH 该 id。
      # 不能用 /releases/tags/<tag> —— 那个端点对草稿返回 404
      # （v1.3.0 用 gh release edit、v1.3.1 用 /releases/tags 都死在这一步）。
      # /releases 列表在有写权限的 token 下是包含草稿的，按 tag 选中即可。
      - name: Publish release once all assets are attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 这个 job 没有 checkout，也读不到运行日志（需要 admin 权限），
          # 所以失败原因必须自己塞进 ::error:: 注解，否则只能看到 exit code 1。
          if ! LIST=$(gh api "repos/$REPO/releases?per_page=100" \
              --jq '.[] | "  \(.id)  \(.tag_name)  draft=\(.draft)  assets=\(.assets|length)"' 2>&1); then
            echo "::error::列 release 失败：$(echo "$LIST" | head -3)"
            exit 1
          fi
          echo "所有 release（含草稿）："
          echo "$LIST"
          if ! ID=$(gh api "repos/$REPO/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"$TAG\") | .id" 2>&1); then
            echo "::error::按 tag 查 release 失败：$(echo "$ID" | head -3)"
            exit 1
          fi
          if [ -z "$ID" ]; then
            echo "::error::找不到 $TAG 对应的 release（上传步骤应当已建草稿）"
            exit 1
          fi
          echo "转正 $TAG（release id=$ID）"
          if ! OUT=$(gh api -X PATCH "repos/$REPO/releases/$ID" -F draft=false \
              --jq '"完成：draft=\(.draft)  \(.html_url)"' 2>&1); then
            echo "::error::转正失败：$(echo "$OUT" | head -3)"
            exit 1
          fi
          echo "$OUT"
