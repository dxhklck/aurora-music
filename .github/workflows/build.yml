name: desktop-build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build (main / preload / renderer)
        run: npm run build

      # 把 musicdl 源码收进 engine/vendor，随包分发（仓库里没有时只建占位，不会失败）
      - name: Vendor engine sources
        run: npm run engine:vendor

      # 生成随包内置的 Python 运行时（engine/python，gitignore，不进仓库）：
      # 嵌入式 3.12 + pip 引导 + musicdl 全量依赖，主进程探测 resources/python/python.exe
      # 只有 Windows 打这个包；macOS/Linux 仍回落系统解释器
      - name: Bundle portable Python (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '3.12.10'
          Invoke-WebRequest "https://www.python.org/ftp/python/$ver/python-$ver-embed-amd64.zip" -OutFile python-embed.zip
          Expand-Archive python-embed.zip -DestinationPath engine/python
          # 启用 site 并把依赖目录挂进搜索路径（与本地 engine/python 的 ._pth 一致）
          $pth = (Get-Item engine/python/python*._pth).FullName
          (Get-Content $pth) -replace '^#import site', 'import site' | Set-Content $pth -Encoding ascii
          Add-Content $pth "`n# engine deps installed here by pip`nLib/site-packages" -Encoding ascii
          Invoke-WebRequest https://bootstrap.pypa.io/get-pip.py -OutFile get-pip.py
          engine\python\python.exe get-pip.py --no-warn-script-location
          engine\python\python.exe -m pip install --disable-pip-version-check -q "musicdl==2.14.2"
          # 依赖瘦身：以下包在 musicdl 核心链路无硬引用（optionalimport / TYPE_CHECKING / 未 import），
          # 卸载可减约 140MB 原始体积。单个卸载失败忽略（上游依赖清单变化时容错）。
          $trim = 'nodejs-wheel', 'av', 'curl-cffi', 'lxml', 'brotli', 'websocket-client', 'puremagic'
          foreach ($pkg in $trim) {
            engine\python\python.exe -m pip uninstall -y -q $pkg 2>$null
          }
          # 自检：vendored 源码必须能在瘦身后完整导入（与 bridge.py 同一导入方式）
          engine\python\python.exe -c "import sys; sys.path.insert(0, 'engine/vendor/musicdl'); from musicdl.modules import BuildMusicClient, SongInfo; print('VENDOR-OK')"
          if ($LASTEXITCODE -ne 0) { throw 'vendored musicdl import check failed' }

      - name: Package
        env:
          # 没有证书时跳过签名与公证，产出可直接运行的安装包
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes electron-builder --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurora-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            # electron-updater 元数据与增量校验文件，必须随 Release 分发
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: warn
          retention-days: 7

  # 推送 v* 标签时触发：汇总三平台安装包并发布到 GitHub Release
  release:
    name: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
