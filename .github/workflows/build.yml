name: desktop-build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # 引擎是纯 TypeScript，91 个用例覆盖 15 个音源的解析与加密逻辑，不需要任何外部运行时
      - name: Engine tests
        run: npm run engine:test

      - name: Build (main / preload / renderer)
        run: npm run build

      - name: Package
        env:
          # 没有证书时跳过签名与公证，产出可直接运行的安装包
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes electron-builder --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurora-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            # electron-updater 元数据与增量校验文件，必须随 Release 分发
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: warn
          retention-days: 7

  # 推送 v* 标签时触发：汇总三平台安装包并发布到 GitHub Release
  release:
    name: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # 主更新源：同步到 GitCode。checkout（全量，含 tags）供脚本与代码镜像两步使用。
      - name: Checkout for GitCode sync
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 上传到「预发布」而不是「草稿」，原因是草稿在 API 里几乎不可见：
      #   /releases/tags/<tag> 对草稿永远 404（v1.3.0 gh release edit、
      #   v1.3.1 PATCH tags 端点、v1.3.2 列 /releases 取 id 全都死在这一步）。
      # 预发布是真实 release：既能按 tag 查到，又不会被 releases/latest 选中，
      # 所以「资产还没传完就被自动更新拉到 404」这个原始问题同样被规避掉。
      - name: Upload installers as prerelease
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: true

      # 资产齐了再转正：prerelease=false 会让它进入 releases/latest，
      # 自动更新才会把这一版当作可升级目标。
      #
      # 这一步在 v1.3.0~v1.3.3 连续失败三次，前两次归因都错了（草稿不可见 / tags 端点 404），
      # 第三次换成 prerelease 仍失败，说明问题不在「怎么查 release」。所以现在不再靠猜：
      # 三条路依次兜底，最后一步只认「最终状态对不对」。
      #   A. gh api PATCH /releases/<id>（GET 取数字 id，请求体用 --input 显式 JSON，
      #      绕开 -F/-f 的布尔/字符串类型推断）
      #   B. softprops 再跑一次（本仓库已验证可用，代价是重传资产）
      #   C. 终检：真的不是 prerelease 才算成功，否则报 ::error::
      # 失败信息一律压成一行写进注解——job 没有 checkout，运行日志还要管理员权限才读得到。
      - name: Promote to latest
        id: promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          oneline() { tr '\n' ' ' | tr -s ' ' | head -c 600; }

          if ! ID=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '.id' 2>&1); then
            echo "::warning::查不到 $TAG 的 release：$(echo "$ID" | oneline)"
            exit 0
          fi
          echo "release id = $ID"

          BODY='{"prerelease":false,"make_latest":"true"}'
          if ! OUT=$(echo "$BODY" | gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "repos/$REPO/releases/$ID" --input - 2>&1); then
            echo "::warning::gh api 转正失败（id=$ID），交给下一步兜底：$(echo "$OUT" | oneline)"
            exit 0
          fi
          echo "完成：$(echo "$OUT" | oneline)"
          echo "ok=true" >> "$GITHUB_OUTPUT"

      # A 失败时用 action 再更新一次（同一个 release，会覆盖已存在的资产）
      - name: Promote fallback via action
        if: steps.promote.outputs.ok != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          prerelease: false
          make_latest: true

      # 只认最终状态：这一步绿了，说明 releases/latest 真的指向本版本
      - name: Verify published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          oneline() { tr '\n' ' ' | tr -s ' ' | head -c 600; }
          if ! INFO=$(gh api "repos/$REPO/releases/tags/$TAG" --jq '"\(.prerelease) \(.draft) \(.assets|length)"' 2>&1); then
            echo "::error::终检读取失败：$(echo "$INFO" | oneline)"
            exit 1
          fi
          set -- $INFO
          echo "prerelease=$1 draft=$2 assets=$3"
          if [ "$1" != "false" ] || [ "$2" != "false" ] || [ "$3" -lt 3 ]; then
            echo "::error::$TAG 仍未正式发布（prerelease=$1 draft=$2 assets=$3）"
            exit 1
          fi
          echo "已发布：https://github.com/$REPO/releases/tag/$TAG"

      # 双源发布：把 Windows 更新资产同步到国内对象存储（COS/OSS 均兼容 S3 协议）。
      # 应用端 STORAGE_FEED（src/main/updater.ts）填上桶地址后，国内用户优先走这里：
      # 自建可信、速度快，且桶里保留全部历史版本文件，差量更新（blockmap）才能生效——
      # GitHub 镜像的 releases/latest/download 只指向最新版，差量必然退化为全量 105MB。
      # 四个 secrets 未配置时跳过：没有桶也照样发布，只是没有国内加速。
      - name: Sync update files to COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
        run: |
          if [ -z "$COS_SECRET_ID" ] || [ -z "$COS_SECRET_KEY" ] || [ -z "$COS_BUCKET" ] || [ -z "$COS_REGION" ]; then
            echo "::notice::未配置 COS_* secrets，跳过国内对象存储同步（不影响 GitHub Release）"
            exit 0
          fi
          # aws cli 预装在 ubuntu runner；COS 完全兼容 S3 协议，直接用即可，不引额外依赖
          ENDPOINT="https://cos.$COS_REGION.myqcloud.com"
          aws configure set aws_access_key_id "$COS_SECRET_ID"
          aws configure set aws_secret_access_key "$COS_SECRET_KEY"
          cd artifacts
          # 只同步 Windows 更新链路需要的三个文件；桶必须保持「只增不删」——
          # 旧版本的 exe 与 blockmap 是差量下载的来源，删了差量就退化成全量
          for f in Aurora-Music-*-x64.exe Aurora-Music-*-x64.exe.blockmap latest.yml; do
            echo "上传 $f"
            aws s3 cp --endpoint-url "$ENDPOINT" --region "$COS_REGION" \
              "$f" "s3://$COS_BUCKET/$f"
          done
          echo "已同步到 s3://$COS_BUCKET/"

      # 主更新源：同步到 GitCode。
      # 版本 release（tag=vX.Y.Z）放三件套供人下载；指针 release（tag=stable）
      # 的同名附件每次被覆盖，应用更新器固定拉 releases/download/stable/<file>。
      # 2026-10-30 实测：tag 路径匿名可下、Range 206；latest/download 别名返回 HTML 不可用。
      # continue-on-error：GitHub 美国 runner 到 GitCode 的连通性不可控（实测 fetch failed），
      # 同步失败只告警不红——发布主体（GitHub Release）已在前面完成，GitCode 侧可由
      # 本机手动补跑 scripts/publish-gitcode.mjs 兜底（见 docs/update-feed-setup.md）。
      - name: Sync update files to GitCode
        continue-on-error: true
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ -z "$GITCODE_TOKEN" ]; then
            echo "::error::缺 GITCODE_TOKEN secret（GitCode 私人令牌），无法同步主更新源"
            exit 1
          fi
          node scripts/publish-gitcode.mjs

      # 代码镜像：main 与标签推到 GitCode（GitHub 仍是 CI 与主开发仓库，GitCode 为镜像备份）
      - name: Mirror code to GitCode
        continue-on-error: true
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
        run: |
          if [ -z "$GITCODE_TOKEN" ]; then
            echo "::error::缺 GITCODE_TOKEN secret，无法镜像代码"
            exit 1
          fi
          git push "https://oauth2:$GITCODE_TOKEN@gitcode.com/dxhklck/aurora_music.git" "origin/main:main" --follow-tags
          git push "https://oauth2:$GITCODE_TOKEN@gitcode.com/dxhklck/aurora_music.git" --tags
