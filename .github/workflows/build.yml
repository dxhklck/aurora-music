name: desktop-build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # 引擎是纯 TypeScript，91 个用例覆盖 15 个音源的解析与加密逻辑，不需要任何外部运行时
      - name: Engine tests
        run: npm run engine:test

      - name: Build (main / preload / renderer)
        run: npm run build

      - name: Package
        env:
          # 没有证书时跳过签名与公证，产出可直接运行的安装包
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes electron-builder --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurora-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            # electron-updater 元数据与增量校验文件，必须随 Release 分发
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: warn
          retention-days: 7

  # 推送 v* 标签时触发：汇总三平台安装包并发布到 GitHub Release
  release:
    name: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 上传到「预发布」而不是「草稿」，原因是草稿在 API 里几乎不可见：
      #   /releases/tags/<tag> 对草稿永远 404（v1.3.0 gh release edit、
      #   v1.3.1 PATCH tags 端点、v1.3.2 列 /releases 取 id 全都死在这一步）。
      # 预发布是真实 release：既能按 tag 查到，又不会被 releases/latest 选中，
      # 所以「资产还没传完就被自动更新拉到 404」这个原始问题同样被规避掉。
      - name: Upload installers as prerelease
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          prerelease: true

      # 资产齐了再转正：prerelease=false 会让它进入 releases/latest，
      # 自动更新才会把这一版当作可升级目标。
      # make_latest 在 API 里是字符串（"true"/"false"/"legacy"），只能用 -f 传，
      # 用 -F 会被当成布尔值而报 422。
      - name: Promote to latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 这个 job 没有 checkout，运行日志也读不到（匿名 API 403），
          # 所以失败原因必须自己塞进 ::error:: 注解，否则只能看到 exit code 1。
          if ! OUT=$(gh api -X PATCH "repos/$REPO/releases/tags/$TAG" \
              -F prerelease=false -f make_latest=true \
              --jq '"完成：prerelease=\(.prerelease)  \(.html_url)"' 2>&1); then
            echo "::error::转正失败：$(echo "$OUT" | head -3)"
            exit 1
          fi
          echo "$OUT"
