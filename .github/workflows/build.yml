name: desktop-build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: build-${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # 引擎是纯 TypeScript，91 个用例覆盖 15 个音源的解析与加密逻辑，不需要任何外部运行时
      - name: Engine tests
        run: npm run engine:test

      - name: Build (main / preload / renderer)
        run: npm run build

      - name: Package
        env:
          # 没有证书时跳过签名与公证，产出可直接运行的安装包
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --yes electron-builder --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aurora-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            # electron-updater 元数据与增量校验文件，必须随 Release 分发
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: warn
          retention-days: 7

  # 推送 v* 标签时触发：汇总三平台安装包并发布到 GitHub Release
  release:
    name: publish-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Upload installers to draft release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          # 先建草稿：资产传完再转正，避免「版本已可见但安装包还下不到」的瞬时 404
          draft: true

      # 用 gh api 走显式路径：这个 job 没有 checkout，`gh release edit` 依赖本地 git 仓库
      # 或 GH_REPO 来判断仓库，在空工作目录里会直接失败（v1.3.0 首次走草稿流程就是这么挂的）。
      # 端点里带 owner/repo 就不需要任何仓库上下文。
      - name: Publish release once all assets are attached
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" \
            -F draft=false
          echo "已发布 ${{ github.ref_name }}"
