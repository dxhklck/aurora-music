appId: com.aurora.music
productName: Aurora Music
directories:
  buildResources: build
  output: release

# 自动更新元数据（latest.yml）按 GitHub Releases 生成，electron-updater 运行时读取
publish:
  provider: github
  owner: dxhklck
  repo: aurora-music

asar: true
# 国内网络从 GitHub 拉 Electron 发行包经常超时，走 npmmirror 镜像（同文件，校验和不变）
electronDownload:
  mirror: https://npmmirror.com/mirrors/electron/
files:
  - out/**/*
  - package.json

# 演示音源是独立资源，不打进 asar，便于主进程按路径直接读取
extraResources:
  - from: resources/demo
    to: demo
  # 托盘图标
  - from: resources/icons
    to: icons
  # 音源引擎是进程内 TS 实现（src/main/engine/ts），安装包不携带任何 Python 运行时。
  # 历史背景见 docs/python-removal.md

win:
  target:
    - nsis
  # 文件名必须用字面量 Aurora-Music，不能引 ${productName}：
  # productName 是「Aurora Music」带空格，空格在「本地文件名 → latest.yml → GitHub 资产名」
  # 这条链上被不同环节各自规范化一次（本地留着空格、GitHub 换成点），
  # 最终 latest.yml 指向的名字和实际资产名对不上，更新永远 404。
  artifactName: Aurora-Music-${version}-${arch}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

mac:
  target:
    - dmg
    - zip
  category: public.app-category.music
  # 未配置开发者证书时跳过公证，本地可直接产出可运行的 .app
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: Aurora-Music-${version}-${arch}.${ext}

linux:
  target:
    - AppImage
    - deb
  category: AudioVideo
  synopsis: 跨平台桌面音乐播放器
  description: 多音源统一适配的沉浸式音乐播放器，支持搜索、榜单、下载与逐行歌词。
  artifactName: Aurora-Music-${version}-${arch}.${ext}
